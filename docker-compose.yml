services:
  # 1. BANCO DE DADOS
  db:
    image: mysql:8.0
    container_name: estoque_db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./database/estoqueApp.sql:/docker-entrypoint-initdb.d/estoqueApp.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 2. BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: estoque_backend
    restart: always

    # ADICIONADO: Exposição da porta 1050 para o host (máquina local/rede)
    ports:
      - "1050:1050"

    environment:
      PORT: 1050
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 3306
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    command: sh -c "node scripts/createAdmin.js && node server.js"

    depends_on:
      db:
        condition: service_healthy

  # 3. FRONTEND
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: estoque_frontend
    restart: always

    depends_on:
      - backend

  # 4. NGINX
  nginx:
    image: nginx:alpine
    container_name: estoque_nginx
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

volumes:
  db_data: